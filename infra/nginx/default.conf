# Docker's internal DNS. Upstreams are resolved per request (proxy_pass with a variable),
# so nginx starts even when core or game is not running yet; their routes then return 503.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 10m;  # CSV import, currency icon upload

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The services own their full prefix (/api/core/..., /api/game/...): it is passed on unchanged.
    # Their /health/* endpoints are for Docker health checks only and are not exposed here.
    location /api/core/ {
        set $core_upstream http://core:8080;
        proxy_pass $core_upstream;
        error_page 502 504 = @service_unavailable;
    }

    location /api/game/ {
        set $game_upstream http://game:8000;
        proxy_pass $game_upstream;
        error_page 502 504 = @service_unavailable;
    }

    # Any other /api path is a typo, not a frontend route.
    location /api/ {
        default_type application/problem+json;
        return 404 '{"title":"Not Found","status":404,"detail":"Unknown API route."}';
    }

    location @service_unavailable {
        default_type application/problem+json;
        return 503 '{"title":"Service Unavailable","status":503,"detail":"The backend service is not running."}';
    }

    # Hashed build output never changes, so browsers may cache it forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (e.g. /teacher/groups/1) fall back to the SPA entry point.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
