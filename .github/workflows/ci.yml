# Checks from CONTRIBUTING.md §6 on every pull request to main.
# Only `ci-ok` should be a required status check: it passes when every job that ran passed,
# so jobs skipped for untouched folders never block a merge.
# Actions are pinned to commits (tags can be moved); Dependabot keeps the pins up to date.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      core: ${{ steps.filter.outputs.core }}
      game: ${{ steps.filter.outputs.game }}
      infra: ${{ steps.filter.outputs.infra }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Pushes to main, manual runs and workflow changes check everything.
          run_all=false
          if [ "$EVENT" != "pull_request" ]; then
            run_all=true
          else
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
            printf 'Changed files:\n%s\n' "$changed"
            if grep -q '^\.github/workflows/' <<< "$changed"; then run_all=true; fi
          fi
          infra_paths='infra/|docker-compose\.yml$|\.env\.example$|\.dockerignore$'
          for area in frontend:frontend/ core:services/core/ game:services/game/ "infra:$infra_paths"; do
            name=${area%%:*}
            path=${area#*:}
            if [ "$run_all" = true ] || grep -Eq "^($path)" <<< "$changed"; then
              result=true
            else
              result=false
            fi
            # The game service has no code yet: its job starts once the project exists.
            if [ "$name" = game ] && [ ! -f services/game/pyproject.toml ]; then result=false; fi
            echo "$name=$result" >> "$GITHUB_OUTPUT"
            declare "changed_$name=$result"
          done
          # The stack builds the frontend into nginx and runs core's migrations against PostgreSQL.
          if [ "$changed_infra" = true ] || [ "$changed_frontend" = true ] || [ "$changed_core" = true ]; then
            echo "compose=true" >> "$GITHUB_OUTPUT"
          else
            echo "compose=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # same as infra/nginx/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  core:
    name: Core service
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: services/core/global.json # .NET 10 SDK; the runner also has 11, which dotnet would pick otherwise
      - run: dotnet restore
      - run: dotnet tool restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore --configuration Release
      # Fails when an entity or configuration change has no migration.
      - run: dotnet ef migrations has-pending-model-changes --project src --no-build --configuration Release
      # Integration tests start PostgreSQL with Testcontainers (Docker is preinstalled on the runner).
      - run: dotnet test --no-build --configuration Release

  game:
    name: Game service
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/game
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: services/game/uv.lock
      # Needs a committed uv.lock, with ruff and pytest as dev dependencies.
      - run: uv sync --locked
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest

  infra-lint:
    name: Infra lint
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
      SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint (Dockerfiles)
        run: |
          for file in infra/*/Dockerfile; do
            echo "== $file"
            docker run --rm -i "$HADOLINT_IMAGE" < "$file"
          done
      - name: shellcheck (shell scripts)
        run: |
          mapfile -t scripts < <(find infra -name '*.sh')
          docker run --rm -v "$PWD:/mnt" -w /mnt "$SHELLCHECK_IMAGE" "${scripts[@]}"

  compose:
    name: Compose stack
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: services/core/global.json # .NET 10 SDK; the runner also has 11, which dotnet would pick otherwise
      - run: cp .env.example .env
      - run: docker compose up --build --wait --wait-timeout 300
      - run: infra/smoke-test.sh
      # Core's migrations must work with the init script's permissions (core_user owns only schema core).
      - name: Apply core migrations as core_user
        working-directory: services/core
        run: |
          set -a; . ../../.env; set +a
          dotnet restore
          dotnet tool restore
          export ConnectionStrings__Core="Host=127.0.0.1;Port=$POSTGRES_PORT;Database=$POSTGRES_DB;Username=core_user;Password=$CORE_DB_PASSWORD"
          dotnet ef database update --project src
      - name: Container logs
        if: failure()
        run: docker compose ps --all && docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Plain CLI image: the gitleaks GitHub Action needs a paid license for organization repos.
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Only the commits this PR or push adds; a manual run scans the whole history.
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push) range="$PUSH_BEFORE..$GITHUB_SHA" ;;
            *) range="" ;;
          esac
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git /repo --redact --verbose --no-banner ${range:+--log-opts="$range"}

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, frontend, core, game, infra-lint, compose, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::A CI job did not pass ($result)."; exit 1 ;;
            esac
          done
