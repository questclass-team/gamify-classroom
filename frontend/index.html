<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef1f7" />
    <title>QuestClass</title>
    <script>
      // The theme before the first paint (no flash). Same rule as src/lib/theme.ts: the stored
      // choice, else the system preference.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('qc:theme')
        } catch (error) {}
        if (theme !== 'light' && theme !== 'dark')
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        if (theme === 'dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#060a2b')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
