# QuestClass development stack. Usage: cp .env.example .env && docker compose up --build
# Adding the core or game service: see infra/README.md.
name: questclass

# Shared by every service (`<<: *defaults`); new services should use it too.
x-defaults: &defaults
  restart: unless-stopped
  # Processes cannot gain privileges (e.g. through setuid binaries) after start.
  security_opt:
    - no-new-privileges:true
  # Docker keeps logs forever by default; a crash loop could fill the disk.
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

# Core's database connection, shared by `core` and `core-migrate`. core_user may use schema core only.
# No Kerberos here: without `Gss Encryption Mode=Disable` Npgsql tries it on every new connection and
# the Alpine image logs "Cannot load library libgssapi_krb5.so.2".
x-core-database: &core-database
  ConnectionStrings__Core: Host=postgres;Port=5432;Database=${POSTGRES_DB:-questclass};Username=core_user;Password=${CORE_DB_PASSWORD:?set CORE_DB_PASSWORD in .env};Gss Encryption Mode=Disable

# Game's database connection, shared by `game` and `game-migrate`. game_user may use schema game only.
x-game-database: &game-database
  DB_NAME: ${POSTGRES_DB:-questclass}
  DB_USER: game_user
  DB_PASSWORD: ${GAME_DB_PASSWORD:?set GAME_DB_PASSWORD in .env}
  DB_HOST: postgres
  DB_PORT: "5432"
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  CORE_BASE_URL: http://core:8080

services:
  postgres:
    <<: *defaults
    image: postgres:18-alpine
    # Default is 10 s before SIGKILL; a killed PostgreSQL has to run crash recovery on next start.
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-questclass}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?set CORE_DB_PASSWORD in .env}
      GAME_DB_PASSWORD: ${GAME_DB_PASSWORD:?set GAME_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Over TCP on purpose: while init scripts run, a temporary server answers on the Unix socket
      # only and is then restarted, so a socket check reports "ready" too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  ldap:
    <<: *defaults
    build: infra/ldap
    environment:
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=labs,dc=questclass,dc=test}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?set LDAP_ADMIN_PASSWORD in .env}
      LDAP_TEST_USER_PASSWORD: ${LDAP_TEST_USER_PASSWORD:-haslo}
    volumes:
      - ldap-data:/var/lib/openldap/openldap-data
    ports:
      - "127.0.0.1:${LDAP_PORT:-389}:389"

  # One-shot: applies core's EF Core migrations, then exits. `core` starts only after it succeeded.
  core-migrate:
    <<: *defaults
    build:
      context: services/core
      target: migrate
    restart: "no" # must not be started again after it exits
    environment:
      <<: *core-database
    depends_on:
      postgres:
        condition: service_healthy

  core:
    <<: *defaults
    build:
      context: services/core
      target: final
    # The app waits up to 20 s for running requests on shutdown; Docker's default is 10 s before SIGKILL.
    stop_grace_period: 30s
    environment:
      <<: *core-database
      Ldap__Host: ldap
      Ldap__BaseDn: ${LDAP_BASE_DN:-dc=labs,dc=questclass,dc=test}
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env}
      Bootstrap__AdminLogins: ${CORE_ADMIN_LOGINS:-admin}
    depends_on:
      core-migrate:
        condition: service_completed_successfully
      ldap:
        condition: service_healthy
    # Reached only through nginx (/api/core/); the health check is in services/core/Dockerfile.
    expose:
      - "8080"

  # One-shot: applies Django migrations, then exits. `game` starts only after it succeeds.
  game-migrate:
    <<: *defaults
    build: services/game
    working_dir: /app
    restart: "no"
    environment:
      <<: *game-database
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "--no-dev", "python", "manage.py", "migrate", "--noinput"]

  game:
    <<: *defaults
    build: services/game
    working_dir: /app
    environment:
      <<: *game-database
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_healthy
      game-migrate:
        condition: service_completed_successfully
    volumes:
      - game-media:/app/media
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-dev",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/game/schema/', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    <<: *defaults
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "${NGINX_PORT:-8080}:80"

volumes:
  game-media:
  postgres-data:
  ldap-data:
